version: "3.9"

services:
  platform-admin:
    image: esjuliorafael/nexus-platform-admin:latest
    container_name: platform-admin
    restart: always
    networks:
      - nexus-network
    environment:
      - NODE_ENV=production
      - PORT=80
      - PLATFORM_ADMIN_USERNAME=${PLATFORM_ADMIN_USERNAME}
      - PLATFORM_ADMIN_PASSWORD_HASH=${PLATFORM_ADMIN_PASSWORD_HASH}
      - PLATFORM_ENCRYPTION_KEY=${PLATFORM_ENCRYPTION_KEY}
      - PLATFORM_BACKUP_DATABASES_JSON=${PLATFORM_BACKUP_DATABASES_JSON}
      - PLATFORM_BACKUP_INTERVAL_MINUTES=${PLATFORM_BACKUP_INTERVAL_MINUTES:-0}
      - PLATFORM_BACKUP_RETENTION_DAILY=${PLATFORM_BACKUP_RETENTION_DAILY:-14}
      - PLATFORM_BACKUP_RETENTION_WEEKLY=${PLATFORM_BACKUP_RETENTION_WEEKLY:-8}
      - PLATFORM_BACKUP_RETENTION_MONTHLY=${PLATFORM_BACKUP_RETENTION_MONTHLY:-6}
    volumes:
      - platform_admin_data:/data

networks:
  nexus-network:
    external: true
    name: nexus-network

volumes:
  platform_admin_data:
