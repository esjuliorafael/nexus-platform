name: CI/CD Nexus Platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-media-processing-job-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --filter "@nexus/api..."

      - name: Generate Prisma clients
        run: pnpm db:generate

      - name: Test BullMQ media job IDs
        run: pnpm --filter @nexus/api test:media-queue

      - name: Test WhatsApp Cloud template readiness
        run: pnpm --filter @nexus/api test:whatsapp-cloud-templates

  build-and-push:
    needs: test-media-processing-job-id
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Nexus API
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline

      # Build & Push Nexus Storefront (Generic Image)
      - name: Build and push Storefront
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-storefront:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-storefront:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline

      # Build & Push Nexus Admin (Generic Image)
      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-admin:${{ github.sha }}
          build-args: |
            VITE_RAFFLE_ENABLED=true
          cache-from: type=gha
          cache-to: type=inline

      # Build & Push Nexus Platform Admin
      - name: Build and push Platform Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/platform-admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-platform-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-platform-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline
